# Cockpit's own tmux server (tmux -L cockpit -f this file).
# Deliberately does NOT source ~/.tmux.conf: personal hooks there (e.g. on client-detached)
# would fire every time the phone connects or disconnects.
set -g history-limit 50000
set -g default-terminal "xterm-256color"
set -g status off
set -g mouse off
set -g escape-time 10
set -g window-size latest
setw -g aggressive-resize on
# Keep a finished agent's last screen visible; the cockpit shows it as "exited".
set -g remain-on-exit on
# An optional session-closed hook is added by lib/tmux.js from cockpit.config.json.
